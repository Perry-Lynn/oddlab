name: Deploy OddLab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the official Pages deployment flow.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run the existing content and routing test suite
        run: npm test

      - name: Derive the Pages base path and origin
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY#*/}"
          echo "ODDLAB_BASE=/${repo}/" >> "$GITHUB_ENV"
          echo "ODDLAB_ORIGIN=https://${owner}.github.io" >> "$GITHUB_ENV"
          echo "ODDLAB_PAGES=1" >> "$GITHUB_ENV"
          echo "ODDLAB_DEFAULT_LANG=zh" >> "$GITHUB_ENV"

      - name: Build the static Pages site
        run: npm run build:pages

      - name: Verify the static paths and blocked backend
        run: npm run verify:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
