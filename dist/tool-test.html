<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>独立工具页测试 · OddLab</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #FAF6EF; color: #2B2B2B; margin: 0; padding: 24px; max-width: 720px; margin-inline: auto; }
  h1 { font-size: 20px; }
  .card { border: 1px solid #E0D8C8; border-radius: 10px; padding: 16px; margin: 12px 0; background: #fff; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; margin-right: 8px; }
  .red { background: #FBE4E4; color: #A33; } .soft { background: #E4EEFB; color: #26609E; }
  button { padding: 8px 16px; border: 1px solid #C9BFA8; border-radius: 8px; background: #fff; font-size: 14px; cursor: pointer; margin: 4px 6px 4px 0; }
  .out { font-size: 13px; color: #555; margin-top: 8px; white-space: pre-wrap; word-break: break-all; background: #FAF7F0; border-radius: 6px; padding: 8px 10px; min-height: 18px; }
  code { background: #F0E9DA; padding: 1px 5px; border-radius: 4px; }
  textarea { width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #C9BFA8; padding: 8px; font-size: 13px; }
  .ok { color: #2E7D32; } .fail { color: #B3261E; }
  a { color: #26609E; }
</style>
</head>
<body>
<h1>独立工具页测试（模拟"工具详情页"）</h1>
<p>本页模拟一个独立工具路径（如 <code>/tool-test</code>），验证：路径直达、<code>?r=</code> 参数保持（刷新）、localStorage 持久化。返回 <a href="index.html">自检首页</a>。</p>

<div class="card">
  <span class="tag red">红线</span><b>参数直达与刷新保持</b>
  <div class="out" id="paramInfo">检测中…</div>
  <button onclick="location.reload()">刷新本页</button>
  <p style="font-size:13px;color:#666;margin:8px 0 0">操作：用 <code>tool-test.html?r=persona-01</code> 直接打开本页 → 点"刷新本页" → 参数回显仍在 = 通过。</p>
</div>

<div class="card">
  <span class="tag soft">可降级</span><b>localStorage 持久化（模拟任务打卡/换题计数）</b>
  <div>
    <button onclick="saveLS()">写入打卡状态</button>
    <button onclick="readLS()">读取</button>
    <button onclick="clearLS()">清除</button>
  </div>
  <div class="out" id="lsOut">未操作</div>
  <p style="font-size:13px;color:#666;margin:8px 0 0">操作：写入 → 刷新本页 → 读取，值还在 = 通过。</p>
</div>

<div class="card">
  <span class="tag soft">可降级</span><b>复制结果（分享降级链路）</b>
  <div>
    <button id="shareBtn" onclick="doShare()">分享结果</button>
    <button onclick="doCopy()">复制结果</button>
  </div>
  <div class="out" id="copyOut">未操作</div>
  <textarea id="fallbackText" style="display:none"></textarea>
</div>

<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const r = params.get('r');

// 仅比较同一路径的一次真实刷新；普通跳转重新记录，缺少参数不算通过。
const baselineKey = 'oddlab_test_r_baseline_v1';
const navigationType = performance.getEntriesByType('navigation')[0]?.type;
let baseline = null;
let storageAvailable = true;
try { baseline = JSON.parse(sessionStorage.getItem(baselineKey) || 'null'); }
catch (_) { storageAvailable = false; }
const line1 = '当前参数：' + (r ? 'r=' + r : '（无）');
let line2;
if (!r) {
  line2 = navigationType === 'reload' && baseline?.value
    ? '刷新后参数丢失 ✗（红线不通过）。'
    : '本次未携带有效参数，尚未验证。请从首页的带参数链接进入后刷新。';
} else if (navigationType === 'reload' && baseline?.path === location.pathname && baseline.value) {
  const same = baseline.value === r;
  line2 = '刷新对比：首次=' + baseline.value + '，现在=' + r + ' → '
    + (same ? '保持一致 ✓（参数刷新保持通过）' : '已变化 ✗（红线不通过）');
} else {
  line2 = '已记录本次参数，尚未验证刷新保持。请点击“刷新本页”。';
}
try { sessionStorage.setItem(baselineKey, JSON.stringify({ path: location.pathname, value: r })); }
catch (_) { storageAvailable = false; }
if (!storageAvailable) line2 = 'sessionStorage 不可用，无法自动比较。请人工核对刷新前后的 r 值；本页其他检查仍可继续。';
$('paramInfo').textContent = line1 + '\n' + line2;

function saveLS() {
  try {
    localStorage.setItem('oddlab_tool_test', JSON.stringify({ date: '2026-10-16', taskId: 'task-19', swapsUsed: 1, done: ['task-19'] }));
    $('lsOut').textContent = '已写入模拟任务状态（含换题计数与打卡列表），刷新后再读取。';
  } catch (e) { $('lsOut').textContent = '写入失败 → 走降级（状态只存内存）'; }
}
function readLS() {
  try {
    const v = localStorage.getItem('oddlab_tool_test');
    $('lsOut').textContent = v ? '读到：' + v : '读到空值（刷新后丢失）→ 走降级';
  } catch (e) { $('lsOut').textContent = '读取失败 → 走降级'; }
}
function clearLS() { try { localStorage.removeItem('oddlab_tool_test'); } catch (e) {} $('lsOut').textContent = '已清除'; }

const shareText = '我在 OddLab 测出了「赛博算命大师」——用 Excel 管理运气的人。你是什么款？';
async function fallbackCopy(text, report) {
  try { await navigator.clipboard.writeText(text); report('已写入剪贴板。'); return true; }
  catch (e) {
    const box = $('fallbackText');
    box.style.display = 'block'; box.value = text; box.select();
    try { if (document.execCommand && document.execCommand('copy')) { report('clipboard API 不可用，execCommand 兜底复制成功。'); return true; } } catch (_) {}
    report('自动复制失败 → 文本框已全选本次内容，请手动复制。');
    return false;
  }
}
async function doShare() {
  if (navigator.share) {
    try { await navigator.share({ title: 'OddLab', text: shareText, url: location.href }); $('copyOut').textContent = '已调起系统分享'; }
    catch (e) { $('copyOut').textContent = '分享被取消/失败：' + e.message; }
  } else {
    $('shareBtn').textContent = '复制结果';
    $('copyOut').textContent = '不支持系统分享 → 已降级为复制，按钮文案已改。';
    await fallbackCopy(shareText, m => { $('copyOut').textContent += '\n' + m; });
  }
}
async function doCopy() {
  const ok = await fallbackCopy(shareText, m => { $('copyOut').textContent = m; });
  if (ok) { $('fallbackText').style.display = 'none'; $('copyOut').textContent = '已复制结果文案，去别处粘贴验证。'; }
  else { $('copyOut').textContent = '复制失败 → 已展示可手动选取文本框（本次内容）。'; }
}
</script>
</body>
</html>
